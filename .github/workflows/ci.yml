name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint/test/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix server

      - name: Test
        run: npm run test --prefix server

      - name: Build
        run: npm run build --prefix server

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch server secrets from SSM
        run: |
          aws ssm get-parameters-by-path \
            --path "/havenhold/prod/server" \
            --with-decryption \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json \
          | python3 -c "
          import json, sys, pathlib
          params = json.load(sys.stdin)
          lines = []
          for p in params:
              key = p['Name'].rsplit('/', 1)[-1]
              value = p['Value']
              if '\n' in value or '\r' in value:
                  print(f'ERROR: SSM parameter {key} contains a newline — not supported in EnvironmentFile format', file=sys.stderr)
                  sys.exit(1)
              lines.append(key + '=' + repr(value))
          pathlib.Path('server.env').write_text('\n'.join(lines) + '\n')
          "

      - name: Fetch frontend secrets from SSM
        run: |
          aws ssm get-parameters-by-path \
            --path "/havenhold/prod/frontend" \
            --with-decryption \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json \
          | python3 -c "
          import json, sys, pathlib
          params = json.load(sys.stdin)
          lines = []
          for p in params:
              key = p['Name'].rsplit('/', 1)[-1]
              value = p['Value']
              if '\n' in value or '\r' in value:
                  print(f'ERROR: SSM parameter {key} contains a newline — not supported in EnvironmentFile format', file=sys.stderr)
                  sys.exit(1)
              lines.append(key + '=' + repr(value))
          pathlib.Path('frontend.env').write_text('\n'.join(lines) + '\n')
          "

      - name: Append feature flag defaults to frontend.env
        run: |
          grep -q '^VITE_PIPELINE_ENABLED='     frontend.env || echo 'VITE_PIPELINE_ENABLED=true'      >> frontend.env
          grep -q '^VITE_INTEGRATIONS_ENABLED=' frontend.env || echo 'VITE_INTEGRATIONS_ENABLED=false' >> frontend.env

      - name: Validate required secrets are present and non-empty
        run: |
          python3 - <<'PY'
          import ast
          import sys
          from pathlib import Path

          required_server = [
              "DATABASE_URL",
              "ANTHROPIC_API_KEY",
              "BETTER_AUTH_SECRET",
              "BETTER_AUTH_URL",
              "CORS_ORIGIN",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_S3_BUCKET",
              "NODE_ENV",
              "PORT",
              "AWS_REGION",
          ]
          required_frontend = ["VITE_AUTH_BASE_URL", "VITE_API_BASE_URL"]

          def parse_env(path: str) -> dict[str, str]:
              values: dict[str, str] = {}
              for raw_line in Path(path).read_text().splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if "=" not in line:
                      continue
                  key, raw_value = line.split("=", 1)
                  key = key.strip()
                  value = raw_value.strip()
                  if not key:
                      continue

                  # SSM-loaded values are written with Python repr(), so decode quoted
                  # literals before validating non-empty semantics.
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                      try:
                          decoded = ast.literal_eval(value)
                      except Exception:
                          decoded = value
                  else:
                      decoded = value

                  values[key] = decoded
              return values

          server = parse_env("server.env")
          frontend = parse_env("frontend.env")

          missing: list[str] = []
          for key in required_server:
              value = server.get(key)
              if value is None or value == "":
                  missing.append(f"server: {key}")

          for key in required_frontend:
              value = frontend.get(key)
              if value is None or value == "":
                  missing.append(f"frontend: {key}")

          if missing:
              print("ERROR: Missing or empty required parameters from SSM:")
              for item in missing:
                  print(f"  {item}")
              sys.exit(1)

          print("All required parameters present and non-empty.")
          PY

      - name: Install SSH key and pin host fingerprint
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: SCP env files to server
        run: |
          scp -i ~/.ssh/deploy_key server.env   ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/havenhold/server/.env
          scp -i ~/.ssh/deploy_key frontend.env ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/havenhold/.env

      - name: Run deploy.sh on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo /usr/bin/bash /opt/havenhold/infra/deploy.sh"

      - name: Verify health endpoint
        run: |
          STATUS=$(ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health")
          [[ "$STATUS" == "200" ]] || { echo "ERROR: health check returned HTTP $STATUS"; exit 1; }
          echo "Health check passed (HTTP $STATUS)"
